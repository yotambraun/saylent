# Every image, GIF and social card is generated, never hand-made, and
# regenerated on release so it can never show a report the renderer no longer
# produces. The generators live in
# scripts/media/ and are documented there; this workflow is only the machine
# that has a browser.
name: Media
on:
  workflow_dispatch:
    inputs:
      demo_url:
        description: "Read-only demo deployment to screenshot (optional; app screens are skipped without it)"
        required: false
        type: string
  release:
    types: [published]
# The job reads the repo and opens a pull request with the regenerated files.
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is deliberately NOT a dependency of this repo: only this job
      # needs a browser, so it is installed here and never shipped to users.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build the CLI (the hero and share card render its report)
        run: npm run build:cli
      - name: Regenerate the media
        env:
          DEMO_URL: ${{ inputs.demo_url }}
        run: npm run media
      - name: Show what changed
        run: git status --porcelain website/public
      - name: Open a pull request with the regenerated files
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: media/regenerated
          base: main
          add-paths: |
            website/public/media/**
            website/public/brand/**
          commit-message: "Regenerate the README and docs media from the Kestrel run"
          title: "Regenerate media"
          body: |
            Regenerated by `.github/workflows/media.yml`.

            Every file here comes from `examples/kestrel/run.json`, rendered by the
            current `packages/report` renderer. Review the hero and the four receipt
            crops in both themes before merging.
          delete-branch: true
      - name: Upload the media as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saylent-media
          path: |
            website/public/media
            website/public/brand
