# Builds website/ (Next.js static export) and deploys it to GitHub Pages at
# https://yotambraun.github.io/saylent/. CI (ci.yml) gates src/**; this
# workflow only ever touches website/ output.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
# Least-privilege token, widened only for the Pages deploy step itself.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_PATH: "1"
      # The home-page instant-check widget is a thin client over the separately
      # deployed services/instant-check. Unset ⇒ the widget does not render.
      NEXT_PUBLIC_INSTANT_CHECK_URL: ${{ vars.NEXT_PUBLIC_INSTANT_CHECK_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
