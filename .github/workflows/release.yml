# Publish the CLI + the two library packages on a version tag, then cut a GitHub
# Release whose notes come from CHANGELOG.md, and move the floating major
# tag the GitHub Action is consumed through.
#
# Auth for `npm publish`: this workflow supports EITHER of the two standard
# approaches, pick one before the first real tag:
#   (a) NPM_TOKEN secret — create an npm "Automation" access token for the
#       saylent/@saylent org and add it as a repo secret named NPM_TOKEN.
#       Simplest to set up; the token itself is a long-lived secret.
#   (b) npm trusted publishing (OIDC) — configure each package
#       (saylent, @saylent/engine, @saylent/report) on npmjs.com under
#       "Trusted publishers" to trust this repo + this workflow file, no
#       secret stored in GitHub at all. Requires npm CLI >= 11.5 (bundled
#       with Node 22+ as of this writing) and the `id-token: write`
#       permission below, which is already granted.
# The publish step below tries NPM_TOKEN first when the secret is set, and
# falls back to OIDC trusted publishing when it is not — no edit needed to
# switch, just add or omit the secret.
name: Release
on:
  push:
    tags:
      - "v*"

# Least-privilege token: read the repo, mint an OIDC token for npm
# provenance/trusted publishing, and write the GitHub Release. Nothing else.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      # the workspace packages export their built dist/; every consumer below
      # (typecheck, tests, the CLI bundle) needs them built first
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build:cli

      - name: Resolve tag version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Publishes saylent (packages/cli), @saylent/engine, and @saylent/report.
      # Each `npm publish` picks up the workspace's own package.json (name,
      # version, files/exports); this step does not edit those files, so a
      # release requires the version already bumped in each package.json
      # ahead of tagging.
      - name: Publish packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          # "./" matters: a bare owner/name is a GitHub shorthand to npm, not a folder
          for pkg in packages/cli packages/engine packages/report; do
            echo "Publishing ${pkg}"
            npm publish "./${pkg}" --provenance --access public
          done

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const version = process.env.RELEASE_VERSION;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = new RegExp(`^## \\[${version.replace(/\./g, "\\.")}\\].*$`, "m");
          const match = heading.exec(changelog);
          if (!match) {
            fs.writeFileSync(
              "release-notes.md",
              `No CHANGELOG.md entry found for ${version}. See CHANGELOG.md.\n`,
            );
            process.exit(0);
          }
          const start = match.index + match[0].length;
          const rest = changelog.slice(start);
          const nextHeading = /^## \[/m.exec(rest);
          const body = (nextHeading ? rest.slice(0, nextHeading.index) : rest).trim();
          fs.writeFileSync("release-notes.md", `${body}\n`);
          EOF
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md

      # `uses: yotambraun/saylent@v1` is how everyone consumes the GitHub Action,
      # and GitHub resolves that literally: without a `v1` tag the action simply
      # does not exist. So every release re-points the floating major tag at the
      # commit just released. Force-moving a tag is the documented convention for
      # actions (actions/checkout@v4 works exactly this way); the immutable
      # `v1.2.3` tag stays available for anyone who wants to pin exactly.
      - name: Move the floating major tag
        run: |
          major="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
          echo "Moved ${major} to ${GITHUB_SHA}"
        env:
          VERSION: ${{ steps.version.outputs.version }}
